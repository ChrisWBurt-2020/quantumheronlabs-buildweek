# quantumheronlabs.com — OpenAI Build Week submission site
# TLS is terminated here; the independent site container listens on localhost:8465.
server {
    listen 80;
    listen [::]:80;
    server_name www.quantumheronlabs.com;

    return 301 https://quantumheronlabs.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name quantumheronlabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quantumheronlabs.com;

    ssl_certificate /etc/letsencrypt/live/quantumheronlabs.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantumheronlabs.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://quantumheronlabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quantumheronlabs.com;

    ssl_certificate /etc/letsencrypt/live/quantumheronlabs.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantumheronlabs.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8465;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
