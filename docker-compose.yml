services:
  quantumheronlabs-buildweek:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantumheronlabs-buildweek:2026.07
    container_name: quantumheronlabs-buildweek
    restart: unless-stopped
    ports:
      - "127.0.0.1:8465:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

